apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-privileged-container
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-privileged
  template:
    metadata:
      labels:
        app: test-privileged
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        securityContext:
          privileged: true
        ports:
        - containerPort: 80